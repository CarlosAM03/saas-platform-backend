events {}
http {
  access_log off;
  server {
    listen 443 ssl;
    server_name frontend.example.test;
    ssl_certificate /etc/nginx/g1.crt;
    ssl_certificate_key /etc/nginx/g1.key;
    location / {
      proxy_pass http://prospector-g1-proxy-api:3000;
      proxy_set_header Host $host;
      # Overwrite client-supplied headers at this verified ingress boundary.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
