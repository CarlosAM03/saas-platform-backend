services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: saas_local
      POSTGRES_PASSWORD: local-dev-only-password
      POSTGRES_DB: saas_local
    volumes:
      - dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_local -d saas_local"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-init:
    build:
      context: .
      target: development
    depends_on:
      db:
        condition: service_healthy
    environment: &dev-environment
      NODE_ENV: development
      DATABASE_ENV: local
      PORT: "3000"
      DATABASE_URL: postgresql://saas_local:local-dev-only-password@db:5432/saas_local
      JWT_SECRET: local-dev-only-jwt-secret-change-me
      JWT_EXPIRES_IN: 8h
      CORS_ORIGINS: http://localhost:4200,http://localhost:3000
      DEV_SEED_PASSWORD: DevOnlyPass123!
      TSC_WATCHFILE: PriorityPollingInterval
      TSC_WATCHDIRECTORY: FixedPollingInterval
    command: ["sh", "-c", "npm run prisma:migrate:deploy && npm run prisma:seed:dev"]
    restart: "no"

  api:
    build:
      context: .
      target: development
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment: *dev-environment
    command: ["npm", "run", "start:dev"]
    volumes:
      - ./src:/app/src
      - ./Prisma:/app/Prisma
      - ./Docs:/app/Docs
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/v1/health/ready', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  test-db:
    image: postgres:16
    profiles: [test]
    environment:
      POSTGRES_USER: saas_test
      POSTGRES_PASSWORD: local-test-only-password
      POSTGRES_DB: saas_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_test -d saas_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  test-postgres:
    build:
      context: .
      target: development
    profiles: [test]
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      NODE_ENV: test
      DATABASE_ENV: test
      DATABASE_URL: postgresql://saas_test:local-test-only-password@test-db:5432/saas_test
      INTEGRATION_TEST_DATABASE_URL: postgresql://saas_test:local-test-only-password@test-db:5432/saas_test
    command: ["sh", "-c", "npm run prisma:migrate:deploy && npm run test:postgres"]

volumes:
  dev-postgres:
